; PlatformIO Project Configuration File
;======================================
[platformio]
default_envs = noota4mb
;default_envs = noota4mbnodisp
;default_envs = wota8mb
;default_envs = wota8mbnodisp

[common]
board = esp-wrover-kit
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip ;Arduino 3.3.9
framework = arduino
upload_protocol = esptool
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.bootloader = dio
board_build.filesystem = littlefs
board_build.partitions = PartitionTables/noota4mb.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, time
monitor_echo = yes
lib_ldf_mode = chain
lib_compat_mode = off
lib_deps = 
	ArduinoJson
	Wire
	densaugeo/base64@^1.4.0
	ESP32Async/ESPAsyncWebServer@^3.11.2
	;https://github.com/schreibfaul1/ESP32-audioI2S.git#2c1aaf4299c38c40f36180307594020bbc1e38b7
	https://github.com/schreibfaul1/ESP32-audioI2S/archive/refs/tags/3.4.6.zip
extra_scripts = 
	scripts/custom_targets.py
build_flags = 
	-D VERSION=1.0.8
	-D BOARD_HAS_PSRAM
;    -mfix-esp32-psram-cache-issue                 ;(not needed for rev.3 chips)
    -mfix-esp32-psram-cache-strategy=memw
	-D CORE_DEBUG_LEVEL=2
	-D CONFIG_ARDUHAL_LOG_COLORS=1
	-D ARDUINO_RUNNING_CORE=1
	-D ARDUINO_EVENT_RUNNING_CORE=1
	-D CONFIG_ASYNC_TCP_USE_WDT=1
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
	-D CONFIG_ASYNC_TCP_PRIORITY=10
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=128
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D CONFIG_ASYNC_TCP_STACK_SIZE=15360
	-D AUTOSHUTDOWN ; comment if HW is not equipped with a circuit for turning on and off with one button
	-D SDCARD       ; comment if HW is not equipped with an SD card slot
	-D BATTERY      ; comment if HW is not equipped with a circuit for measuring battery voltage
;	-D AUDIO_RUNTIME=1
;	-D DEBUG


[env:noota4mb]
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
monitor_echo = ${common.monitor_echo}
monitor_filters = ${common.monitor_filters}
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = PartitionTables/noota4mb.csv
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.flash_mode = ${common.board_build.flash_mode}
board_build.bootloader = ${common.board_build.bootloader}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_compat_mode = ${common.lib_compat_mode}
lib_deps = 
	${common.lib_deps}
	olikraus/U8g2@^2.35.7
extra_scripts = 
	${common.extra_scripts}
	post:scripts/NO4MBdeploy.py
build_flags =
	${common.build_flags}
	-D DISP
	-D USER_SETUP_LOADED
	-D ST7735_DRIVER
	-D ST7735_BLACKTAB
	-D TFT_MISO=-1
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=21
	-D TFT_DC=22
	-D TFT_RST=-1
	-D TOUCH_CS=-1
	-D OTA=false
	-D DATAWEB

